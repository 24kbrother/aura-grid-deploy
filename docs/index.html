<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aura Grid Developer Center</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Aura Grid Pro Custom Widget Developer Manuals and Specifications.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Themeable CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      /* Aura Grid Slate-Dark Palette */
      --theme-color: #22d3ee;
      --base-background: #0f172a;
      --sidebar-background: #141a23;
      --sidebar-border-color: rgba(255, 255, 255, 0.08);
      --sidebar-width: 280px;
      
      --base-color: #e2e8f0;
      --heading-color: #ffffff;
      --link-color: #22d3ee;
      
      --code-theme-background: #1e293b;
      --code-inline-background: rgba(255, 255, 255, 0.05);
      --code-inline-color: #38bdf8;
      
      --notice-tip-border-color: #22d3ee;
      --notice-tip-background: rgba(34, 211, 238, 0.05);
      
      --search-input-background: rgba(255, 255, 255, 0.05);
      --search-input-border-color: rgba(255, 255, 255, 0.1);
      --search-input-placeholder-color: #64748b;
    }
    
    /* Premium visual overrides */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    
    .sidebar {
      border-right: 1px solid var(--sidebar-border-color);
    }
    
    .markdown-section pre {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    
    .markdown-section code {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
    }

    .docsify-copy-code-button {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #e2e8f0 !important;
      border-radius: 6px !important;
      font-size: 11px !important;
      padding: 0.4em 0.8em !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading Aura Grid Developer Hub...</div>
  <script>
    window.$docsify = {
      name: 'Aura Grid Dev Hub',
      repo: '24kbrother/aura-grid-deploy',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档 / Search Docs...',
        noData: '未找到结果 / No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
